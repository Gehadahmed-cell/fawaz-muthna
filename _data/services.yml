- slug: construction
  num: "01"
  icon: "i-crane"
  name: "بناء وإنشاء"
  title: "مقاولات وبناء في عدن | البناء والإنشاء والإشراف الهندسي"
  desc: "تنفيذ المشاريع الإنشائية في عدن وجميع المحافظات بأعلى معايير الجودة والسلامة، بفريق هندسي متخصص وإدارة احترافية للمشاريع."
  keywords: "مقاولات عدن, شركة مقاولات اليمن, بناء وإنشاء عدن, إشراف هندسي, تنفيذ مشاريع إنشائية"
  lead: "ننفّذ المشاريع الإنشائية من الأساسات حتى التسليم، بإشراف هندسي مباشر على كل مرحلة، والتزام بالمواصفات المتفق عليها وبالجدول الزمني المعتمد قبل البدء."
  photo: "service-01.jpg"
  photo_alt: "مهندسو مؤسسة فواز مثنى يراجعون المخططات أمام مبنى تحت الإنشاء"
  includes:
    - "تنفيذ الهياكل الخرسانية للمباني السكنية والتجارية"
    - "أعمال الحفر والأساسات وتجهيز المواقع"
    - "الإشراف الهندسي على مراحل التنفيذ وتقارير دورية"
    - "أعمال البناء والتشطيبات الداخلية والخارجية"
    - "إدارة المشاريع وتنسيق المقاولين من الباطن"
    - "حساب الكميات وإعداد عروض الأسعار المفصّلة"
  steps:
    - title: "التواصل والمعاينة"
      body: "نستمع لتفاصيل مشروعك ونعاين الموقع لتحديد طبيعة العمل ومتطلباته."
    - title: "عرض السعر والجدول"
      body: "نقدّم عرضاً مفصّلاً بالبنود وحساب الكميات، مع جدول زمني واضح للمراحل."
    - title: "التنفيذ والإشراف"
      body: "ينفّذ فريقنا الأعمال بإشراف هندسي مباشر ومتابعة دورية لنسب الإنجاز."
    - title: "التسليم والضمان"
      body: "نسلّم العمل مطابقاً للمواصفات، ونبقى معك في الصيانة والمتابعة بعد التسليم."
  why:
    - icon: "i-users"
      title: "فريق هندسي متخصص"
      body: "مهندسون وفنيون بخبرة ميدانية في المشاريع الإنشائية، لا مجرد عمالة."
    - icon: "i-shield"
      title: "التزام بالسلامة"
      body: "اشتراطات السلامة المهنية مطبّقة في الموقع طوال فترة التنفيذ."
    - icon: "i-check"
      title: "تسعير شفاف"
      body: "عرض سعر مفصّل بالبنود وحساب كميات واضح، دون رسوم مفاجئة بعد التعاقد."
  faq:
    - q: "هل تنفذون المشاريع السكنية الصغيرة أم الكبيرة فقط؟"
      a: "ننفّذ الاثنين. من إضافة دور أو ترميم هيكل، إلى تنفيذ مبنى كامل من الأساسات. تواصل معنا بتفاصيل مشروعك وسنوضح ما إذا كان ضمن نطاق عملنا وما التكلفة التقديرية."
    - q: "هل يمكن طلب الإشراف الهندسي دون التنفيذ؟"
      a: "نعم. نقدّم الإشراف الهندسي كخدمة مستقلة على مشاريع ينفّذها طرف آخر، وتشمل متابعة المطابقة للمواصفات ومراحل التنفيذ وتقارير دورية لصاحب المشروع."
    - q: "كيف تُحسب تكلفة المشروع؟"
      a: "بعد المعاينة نُعدّ حساب كميات مفصّلاً لكل بند (خرسانة، حديد، بلوك، تشطيبات…) ونقدّم عرضاً واضحاً. لا نبدأ أي عمل قبل اعتمادك للعرض."

- slug: logistics
  num: "02"
  icon: "i-truck"
  name: "الخدمات اللوجستية والنقل"
  title: "نقل بضائع في عدن وجميع المحافظات | خدمات لوجستية متكاملة"
  desc: "أسطول حديث من الشاحنات لنقل البضائع بأمان وكفاءة بين عدن وجميع المحافظات، مع خدمات لوجستية متكاملة وفق أعلى معايير الجودة."
  keywords: "نقل بضائع عدن, شركة نقل اليمن, خدمات لوجستية عدن, شحن بري, نقل بين المحافظات"
  lead: "ننقل بضائعك بأسطول مملوك للمؤسسة، بتأمين كامل للحمولة ومتابعة للشحنة حتى التسليم، بين عدن وجميع المحافظات وفق نطاق التشغيل المتاح."
  photo: "service-02.jpg"
  photo_alt: "شاحنة نقل حديثة ضمن أسطول مؤسسة فواز مثنى"
  includes:
    - "نقل البضائع العامة بين عدن وجميع المحافظات"
    - "شاحنات مغلقة ومكشوفة حسب طبيعة الحمولة"
    - "نقل مواد البناء ومستلزمات المشاريع إلى المواقع"
    - "تأمين الحمولة وربطها وفق اشتراطات السلامة"
    - "متابعة الشحنة وإبلاغك بحالتها حتى التسليم"
    - "حلول لوجستية للشركات بعقود دورية"
  steps:
    - title: "تحديد الشحنة"
      body: "تخبرنا بنوع البضاعة ووزنها التقريبي ونقطتي التحميل والتسليم."
    - title: "تحديد المركبة والسعر"
      body: "نحدد المركبة المناسبة ونقدّم السعر شاملاً، دون تكاليف مخفية."
    - title: "التحميل والنقل"
      body: "نحمّل ونؤمّن الحمولة وفق اشتراطات السلامة، ثم ننقلها في الموعد المتفق عليه."
    - title: "التسليم والتأكيد"
      body: "نسلّم الشحنة في وجهتها ونؤكد لك الاستلام."
  why:
    - icon: "i-truck"
      title: "أسطول مملوك"
      body: "المركبات ملك المؤسسة، فلا وسطاء ولا تأخير في التوفّر."
    - icon: "i-shield"
      title: "حمولة مؤمّنة"
      body: "ربط وتأمين الحمولة وفق اشتراطات السلامة قبل انطلاق أي رحلة."
    - icon: "i-clock"
      title: "التزام بالموعد"
      body: "موعد تسليم متفق عليه مسبقاً، ومتابعة تُبلغك بأي مستجد."
  faq:
    - q: "ما أنواع البضائع التي تنقلونها؟"
      a: "البضائع العامة، ومواد البناء، ومستلزمات المشاريع، والمعدات. للبضائع ذات الطبيعة الخاصة تواصل معنا لنوضح إمكانية النقل ومتطلباته."
    - q: "هل تنقلون خارج محافظة عدن؟"
      a: "نعم، إلى جميع المحافظات وفق نطاق التشغيل المتاح. تُحتسب تكاليف الطريق ضمن السعر بشكل واضح قبل التحميل."
    - q: "كيف تُحسب تكلفة النقل؟"
      a: "حسب نوع المركبة المطلوبة، والمسافة، وطبيعة الحمولة. أعطنا التفاصيل عبر الواتساب وسنعطيك سعراً محدداً."

- slug: car-rental
  num: "03"
  icon: "i-car"
  name: "تأجير سيارات"
  title: "تأجير سيارات في عدن | تويوتا برادو VIP بسائق أو بدون"
  desc: "تأجير سيارات حديثة (تويوتا برادو) لكبار الشخصيات ورجال الأعمال والوفود في عدن — راحة وفخامة وأمان، مع سائق عند الطلب، بعقود يومية أو شهرية."
  keywords: "تأجير سيارات عدن, تأجير برادو عدن, سيارات VIP اليمن, تأجير سيارة بسائق عدن"
  lead: "سيارات حديثة من فئة VIP للوفود ورجال الأعمال والمناسبات الرسمية. تستلمها نظيفة ومجهّزة، بسائق يعرف طرق المحافظات أو بدونه، بعقد يومي أو شهري."
  photo: "service-03.jpg"
  photo_alt: "سيارة تويوتا برادو بيضاء متاحة للتأجير لدى مؤسسة فواز مثنى"
  includes:
    - "تويوتا برادو وسيارات فارهة لكبار الشخصيات"
    - "خيار السائق: مع سائق محترف أو بدون سائق"
    - "عقود يومية أو أسبوعية أو شهرية"
    - "استقبال وتوصيل الوفود والمناسبات الرسمية"
    - "عقود شهرية للشركات والمنظمات"
    - "تسليم السيارة نظيفة ومفحوصة قبل كل عقد"
  steps:
    - title: "تحديد الطلب"
      body: "تخبرنا بالمدة، وهل تريد سائقاً، والمناطق التي ستتنقل فيها."
    - title: "تأكيد التوفّر والسعر"
      body: "نؤكد لك توفّر السيارة في التاريخ المطلوب ونتفق على السعر."
    - title: "استلام السيارة"
      body: "تستلم السيارة نظيفة ومجهّزة، أو يصلك السائق في الموعد والمكان المتفقين."
    - title: "التسليم"
      body: "تُعيد السيارة في نهاية المدة، أو نمدّد العقد إن احتجت."
  why:
    - icon: "i-star"
      title: "سيارات حديثة"
      body: "أسطول مُحافَظ عليه ومفحوص، لا سيارات مستهلكة."
    - icon: "i-users"
      title: "سائقون محترفون"
      body: "سائقون يعرفون طرق عدن والمحافظات، مناسبون لاستقبال الوفود."
    - icon: "i-shield"
      title: "راحة وفخامة وأمان"
      body: "ثلاثتها معاً — وهذا ما يبحث عنه العميل في هذه الفئة تحديداً."
  faq:
    - q: "ما نوع السيارات المتوفرة؟"
      a: "سيارات حديثة من فئة VIP، وأبرزها تويوتا برادو. للاستفسار عن طراز محدد أو عدد سيارات لوفد، تواصل معنا مباشرة."
    - q: "هل يمكن استئجار السيارة بسائق؟"
      a: "نعم، مع سائق أو بدونه حسب رغبتك. السائق خيار مناسب للوفود والمناسبات الرسمية والتنقل بين المحافظات."
    - q: "هل توجد عقود شهرية للشركات؟"
      a: "نعم. نوفّر عقوداً شهرية للشركات والمنظمات بأسعار تختلف عن التأجير اليومي. تواصل معنا لمناقشة احتياجك."

- slug: maintenance
  num: "04"
  icon: "i-tool"
  name: "صيانة وترميم"
  title: "صيانة وترميم المباني في عدن | ترميم وتجديد باحترافية"
  desc: "صيانة شاملة للمباني والمنشآت في عدن، وترميم وتجديد باحترافية لضمان استدامة وجودة المباني."
  keywords: "ترميم مباني عدن, صيانة منشآت اليمن, ترميم وتجديد, صيانة مباني عدن"
  lead: "نعالج ما يحتاج علاجاً في المبنى القائم — من التشققات والرطوبة إلى تجديد الواجهات — بأعمال تدوم، لا بترقيع يعود بعد أشهر."
  photo: "service-04.jpg"
  photo_alt: "فني على سقالة يعمل في ترميم واجهة مبنى"
  includes:
    - "صيانة شاملة للمباني السكنية والتجارية"
    - "ترميم الهياكل ومعالجة التشققات"
    - "معالجة الرطوبة والتسربات"
    - "تجديد الواجهات وأعمال الدهان"
    - "صيانة دورية بعقود للمنشآت والشركات"
    - "تقييم حالة المبنى وتقرير بما يحتاجه"
  steps:
    - title: "المعاينة والتقييم"
      body: "نعاين المبنى ونحدد سبب المشكلة لا أثرها الظاهر فقط."
    - title: "التقرير وعرض السعر"
      body: "نوضح لك ما يحتاج معالجة وما يمكن تأجيله، مع عرض سعر بالبنود."
    - title: "التنفيذ"
      body: "ننفّذ أعمال الترميم بمواد مناسبة لطبيعة المشكلة ومناخ المنطقة."
    - title: "المتابعة"
      body: "نتابع معك بعد التسليم للتأكد من أن المعالجة صمدت."
  why:
    - icon: "i-tool"
      title: "معالجة السبب"
      body: "نبحث عن مصدر المشكلة، فالترميم الذي يتجاهل السبب يعود سريعاً."
    - icon: "i-award"
      title: "متابعة بعد التسليم"
      body: "لا تنتهي علاقتنا بانتهاء العمل — نتابع أن المعالجة صمدت."
    - icon: "i-check"
      title: "وضوح فيما يحتاج وما لا يحتاج"
      body: "نخبرك بما يمكن تأجيله بدل توسيع العمل بلا داعٍ."
  faq:
    - q: "هل تعالجون التشققات والرطوبة؟"
      a: "نعم، وهما من أكثر ما يُطلب منا. نبدأ بتحديد المصدر — تسرب، هبوط، أو عيب تنفيذ — لأن المعالجة السطحية دون سبب واضح تعود بعد أشهر."
    - q: "هل توفّرون عقود صيانة دورية؟"
      a: "نعم، للمنشآت والشركات التي تفضّل صيانة مجدولة بدل انتظار حدوث العطل. تواصل معنا لتحديد نطاق العقد."
    - q: "هل تعملون على المباني القديمة؟"
      a: "نعم. المباني القديمة تحتاج تقييماً أدق قبل البدء، ولهذا نبدأ دائماً بالمعاينة وتقرير الحالة قبل أي عرض سعر."

- slug: marketing
  num: "05"
  icon: "i-megaphone"
  name: "تسويق وتوزيع"
  title: "خدمات تسويق وتوزيع في عدن | شبكة توزيع واسعة"
  desc: "خدمات تسويق فعالة وتوزيع في الوقت المناسب، عبر شبكة توزيع واسعة تضمن وصول منتجاتك إلى الأسواق المستهدفة."
  keywords: "توزيع منتجات عدن, شبكة توزيع اليمن, تسويق وتوزيع, توصيل بضائع للأسواق"
  lead: "نوصل منتجك إلى السوق الذي تستهدفه فعلاً، بشبكة توزيع تغطي عدن والمحافظات، وبتوقيت يحافظ على حركة مبيعاتك."
  photo: "service-05.jpg"
  photo_alt: "رافعة شوكية تُحمّل بضائع في شاحنة داخل مستودع"
  includes:
    - "توزيع المنتجات على منافذ البيع في عدن والمحافظات"
    - "شبكة توزيع واسعة تصل للأسواق المستهدفة"
    - "جدولة التوزيع بما يحافظ على انتظام التوريد"
    - "نقل المنتجات من المستودع إلى نقاط البيع"
    - "خدمات تسويقية تدعم انتشار المنتج"
    - "متابعة حركة التوزيع وإبلاغك بها"
  steps:
    - title: "تحديد المنتج والسوق"
      body: "نتعرف على منتجك والأسواق والمناطق التي تريد الوصول إليها."
    - title: "خطة التوزيع"
      body: "نضع خطة تغطية وجدولاً زمنياً للتوزيع يناسب طبيعة المنتج."
    - title: "التنفيذ"
      body: "ننفّذ التوزيع عبر شبكتنا ومركباتنا إلى نقاط البيع المستهدفة."
    - title: "المتابعة والتقارير"
      body: "نتابع حركة التوزيع ونبلغك بما تم وما يحتاج تعديلاً."
  why:
    - icon: "i-package"
      title: "شبكة واسعة"
      body: "تغطية تصل إلى الأسواق المستهدفة، لا إلى أقرب نقطة فقط."
    - icon: "i-clock"
      title: "توزيع في وقته"
      body: "التوقيت في التوزيع يحدد استمرار المنتج على الرف."
    - icon: "i-truck"
      title: "نقل ذاتي"
      body: "نستخدم أسطولنا نفسه، فلا اعتماد على طرف ثالث في التوصيل."
  faq:
    - q: "ما المناطق التي تغطيها شبكة التوزيع؟"
      a: "عدن والمحافظات وفق نطاق التشغيل المتاح. أخبرنا بالأسواق التي تستهدفها وسنوضح مدى التغطية."
    - q: "هل تناسب خدمتكم المنتجات الصغيرة؟"
      a: "نعم. تواصل معنا بتفاصيل المنتج وحجم الكميات وسنوضح الخطة المناسبة والتكلفة."
    - q: "هل تشمل الخدمة التخزين؟"
      a: "التوزيع والنقل هما الأساس. للاستفسار عن التخزين تواصل معنا لنوضح ما هو متاح حالياً."
